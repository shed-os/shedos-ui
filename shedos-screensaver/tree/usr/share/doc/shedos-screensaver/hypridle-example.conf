# ShedOS animated screensaver; opt-in hypridle snippet for users
# whose ~/.config/hypr/hypridle.conf was created BEFORE the
# screensaver shipped (i.e. the /etc/skel default didn't apply).
#
# Copy this listener block into your ~/.config/hypr/hypridle.conf,
# inserting it BEFORE the listener that calls `loginctl lock-session`
# so the screensaver runs during the pre-lock idle window. Then
# `systemctl --user restart hypridle.service` (or just kill it; the
# Hyprland exec-once will respawn it on next login).
#
# What it does:
#   - 240 s of inactivity → systemctl --user start fires the
#     shedos-screensaver.service user-level unit.
#   - The unit runs /usr/bin/shedos-screensaver --idle-daemon with
#     --hold 5 (each effect holds 5 s before transitioning).
#   - on-resume sends `systemctl --user stop`, which dispatches the
#     unit's KillSignal=SIGUSR1 and falls back to SIGKILL after
#     TimeoutStopSec=5 if the binary doesn't exit cleanly. The
#     layer-shell surface is gone before the user's first keystroke
#     reaches a focused app.
#
# This replaces the older systemd-run + pkill approach, which broke
# silently whenever the screensaver's argv changed (the pkill -f
# pattern depended on a specific cmdline shape).

listener {
    timeout = 240
    on-timeout = systemctl --user start shedos-screensaver.service
    on-resume = systemctl --user stop shedos-screensaver.service
}
