# ShedOS animated screensaver — opt-in hypridle snippet for users
# whose ~/.config/hypr/hypridle.conf was created BEFORE the
# screensaver shipped (i.e. the /etc/skel default didn't apply).
#
# Copy this listener block into your ~/.config/hypr/hypridle.conf,
# inserting it BEFORE the listener that calls `loginctl lock-session`
# so the screensaver runs during the pre-lock idle window. Then
# `systemctl --user restart hypridle.service` (or just kill it; the
# Hyprland exec-once will respawn it on next login).
#
# What it does:
#   - 240 s of inactivity → fullscreen animated overlay launches.
#   - Style rotates every 60 s while idle (--shuffle 60).
#   - --idle-daemon makes the binary ignore keypresses; only SIGUSR1
#     tears it down (keypress would race the lockscreen handoff).
#   - on-resume sends SIGUSR1 so the screensaver exits the moment the
#     user generates input. The user's first keystroke then reaches
#     the focused application or hyprlock as normal.
#
# `systemd-run --user --scope --quiet --unit=shedos-screensaver` makes
# the spawn idempotent: a second invocation while the unit exists is
# a no-op, so spurious idle re-fires don't pile up multiple instances.
# `pkill ... || true` stops on-resume from logging a noisy "no process
# found" warning when the screensaver isn't actually running.

listener {
    timeout = 240
    on-timeout = systemd-run --user --scope --quiet --unit=shedos-screensaver \
        /usr/bin/shedos-screensaver --mode=wayland --idle-daemon --shuffle 60
    on-resume = pkill -SIGUSR1 -f 'shedos-screensaver --idle-daemon' || true
}
