# /etc/shedos/screensaver.toml — default settings for shedos-screensaver.
#
# This file is backed up by pacman: edits survive package upgrades
# (pacman writes the new packaged version to .pacnew if the maintainer
# bumps it, leaving your version intact).
#
# CLI flags override these values.

[defaults]
# Lock to a specific effect, or empty for "random each cycle". One of:
# rain, decrypt, print, scattered, wipe, slide, expand, crumble,
# spotlights, burn, colorshift, glitch, quantum, synthgrid,
# matrix-rain, hologram. Run `shedos-screensaver --list-effects`.
effect = ""

# Lock to a specific logo variant, or empty for "random each cycle".
# One of: block, ansi-shadow, big, outline, 3d-iso, gradient,
# emboss, shadow-cast, wide, triple-line, tall, mirror-flip,
# stripe, boxed, checkered.
# Run `shedos-screensaver --list-logos`.
logo = ""

# Color override for the target art. Empty = use the logo variant's
# default Catppuccin color (per-variant).
# Accepts: #rrggbb, r,g,b, named ANSI, or Catppuccin Mocha shorthand.
color = ""

# Frame budget. Drop to 15 on battery-constrained systems.
fps = 30

# Hold the resolved art this many seconds between effects.
# 0 = one-shot mode: animate once, sit on the resolved frame until
# --duration / signal / keypress (good for testing single effects).
hold = 3.0

# Render backend. "auto" picks tty when invoked from an interactive
# terminal, wayland otherwise.
mode = "auto"

# Audio reactivity. "desktop" captures system audio (requires a
# *.monitor input device — see /usr/share/doc/shedos-screensaver/
# audio-setup.md). "mic" captures from the default microphone.
# "none" disables audio reactivity.
audio_source = "none"

# Wayland-mode wallpaper backdrop. "auto" tries
# ~/.config/hypr/wallpaper.png, "none" disables, or pass an absolute path.
wallpaper = "auto"

# Brightness multiplier on the wallpaper backdrop (0.0 = black,
# 1.0 = full brightness). 0.3 keeps the foreground animation legible.
wallpaper_dim = 0.3

# Locale override (BCP-47, e.g. en-US, fr-FR). Empty = inherit from
# the environment ($LC_ALL → $LC_MESSAGES → $LANG → en-US).
locale = ""

# Optional: a custom rotation. If non-empty, --shuffle picks
# uniformly across these effect names rather than the full registry.
# Example to limit to fast-paced effects:
#   cycle = ["rain", "scattered", "matrix-rain", "glitch"]
cycle = []

[lock]
# Settings for `shedos-screensaver --mode=lock`. Each is overridable
# from the CLI via --prompt-after-secs / --prompt-idle-hide-secs /
# --prompt-cycles.

# Screensaver dwell after the lock engages, before the password prompt
# appears automatically. A keypress brings the prompt up early.
prompt_after_secs = 300

# Idle dwell while the prompt is visible before it hides and the
# screensaver resumes. Reset by every keystroke.
prompt_idle_hide_secs = 120

# Prompt-screensaver round-trips before the lock screen powers
# monitors off via wlr-output-power-management. Each completed round
# trip increments; on the next Screensaver entry past this count the
# state machine transitions to DPMS off until input wakes the panel.
prompt_cycles = 3
