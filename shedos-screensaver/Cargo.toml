[workspace]
resolver = "2"
members = [
    "crates/shedos-screensaver-core",
    "crates/shedos-screensaver-i18n",
    "crates/shedos-screensaver-logos",
    "crates/shedos-screensaver-effects",
    "crates/shedos-screensaver-tty",
    "crates/shedos-screensaver-wayland",
    "crates/shedos-screensaver-audio",
    "crates/shedos-screensaver-cli",
]

[workspace.package]
# Internal cargo crate version; kept as semver because cargo rejects
# leading zeros (the CalVer "2026.04.25" used by the PKGBUILD trips
# its parser on "04"). Bumped only on internal API changes; the user-
# facing version comes from the PKGBUILD pkgver and is what pacman
# reports.
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/theshedman/shedos"
authors = ["ShedOS"]
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
fluent = "0.16"
fluent-bundle = "0.15"
unic-langid = { version = "0.9", features = ["macros"] }
crossterm = "0.28"
rand = "0.8"
rand_chacha = "0.3"
signal-hook = "0.3"
insta = "1"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cpal = "0.15"
realfft = "3"
libc = "0.2"
pam = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

shedos-prompt-ui = { path = "../shedos-prompt-ui" }
shedos-screensaver-core = { path = "crates/shedos-screensaver-core" }
shedos-screensaver-i18n = { path = "crates/shedos-screensaver-i18n" }
shedos-screensaver-logos = { path = "crates/shedos-screensaver-logos" }
shedos-screensaver-effects = { path = "crates/shedos-screensaver-effects" }
shedos-screensaver-tty = { path = "crates/shedos-screensaver-tty" }
shedos-screensaver-wayland = { path = "crates/shedos-screensaver-wayland" }
shedos-screensaver-audio = { path = "crates/shedos-screensaver-audio" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = "limited"
