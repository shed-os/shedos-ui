[package]
name = "shedos-prompt-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared prompt-surface rendering for ShedOS lock surfaces (greeter, screensaver lock)"
repository = "https://github.com/theshedman/shedos"
publish = false

[lib]
name = "shedos_prompt_ui"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
