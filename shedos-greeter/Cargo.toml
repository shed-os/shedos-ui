[package]
name = "shedos-greeter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ShedOS greetd greeter — hyprlock-styled login screen"
repository = "https://github.com/theshedman/shedos"
publish = false

[[bin]]
name = "shedos-greeter"
path = "src/main.rs"

[dependencies]
shedos-prompt-ui = { path = "../shedos-prompt-ui" }
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
